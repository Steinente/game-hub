services:
  game-hub:
    image: steinente/game-hub:${GAME_HUB_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - '${GAME_HUB_PORT:-4000}:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
